  - id: msg-offsite-3
    from_name: Helena Rocha
    from_address: helena.rocha@brightlogistics.example
    date: 2026-10-22T15:40:00Z
    subject: "Re: Offsite planning"
    body: "I can't do the 12th. Any day the week after works for me."
  - id: msg-offsite-4
    from_name: Marco Pires
